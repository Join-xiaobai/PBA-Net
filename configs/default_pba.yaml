# PBA-Net Default Configuration
experiment:
  name: "pba_net_resnet50_5fold"
  project: "breast_ultrasound_stratification"
  seed: 20260613

model:
  backbone: "resnet50"
  pretrained: true
  dropout: 0.1
  empty_tau: 0.002
  beam_attn_heads: 4
  beta_safety_blend: 0.3

data:
  input_size: 256
  batch_size: 8
  num_workers: 4
  train_augment: true

training:
  epochs: 80
  min_epochs: 20
  patience: 15
  optimizer: "AdamW"
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: "ReduceLROnPlateau"
  scheduler_patience: 5
  scheduler_factor: 0.5
  min_lr: 0.000001
  amp: true

loss:
  lambda_seg: 1.0
  lambda_cls: 1.0
  lambda_aux: 0.5
